name: Build GembyAV.exe
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pyinstaller --onefile --noconsole --name GembyAV --uac-admin --hidden-import pefile gemby_av.py
      - uses: actions/upload-artifact@v4
        with:
          name: GembyAV-exe
          path: dist/GembyAV.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/GembyAV.exe
