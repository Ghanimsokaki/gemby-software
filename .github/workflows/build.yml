name: Build GembyAV.exe
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pyinstaller --onefile --noconsole --name GembyAV --uac-admin --hidden-import pefile --hidden-import yara gemby_av.py
      - name: Commit exe to repo
        shell: bash
        run: |
          cp dist/GembyAV.exe GembyAV.exe
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f GembyAV.exe
          git commit -m "Update GembyAV.exe" || echo "No changes"
          git push origin main
